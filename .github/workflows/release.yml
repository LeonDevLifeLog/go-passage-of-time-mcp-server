# Cross-compiles release binaries and attaches them to the published release.
#
# Publishing moved off `actions/upload-release-asset@v1`, which has been
# deprecated since 2021, onto `gh release upload`.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write # Required to upload release assets

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.24"]
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
        exclude:
          # Windows on arm64 is not a target we ship.
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Test
        run: go test ./...

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          asset="go-potms-${{ matrix.goos }}-${{ matrix.goarch }}-${{ github.event.release.tag_name }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            asset="${asset}.exe"
          fi
          go build -trimpath -o "$asset" ./go-potms
          echo "ASSET=$asset" >> "$GITHUB_ENV"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" "$ASSET" --clobber
