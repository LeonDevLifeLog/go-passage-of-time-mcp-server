# Builds and tests the project on every push and pull request, so regressions
# are caught at review time rather than only at release time.
name: Go

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.24", "stable"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Verify formatting
        run: |
          unformatted="$(gofmt -l . || true)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test -v ./internal/...

      - name: End-to-end tests
        run: go test -v ./e2e/

      - name: Race detector
        run: go test -race ./...

      - name: Coverage
        run: go test -cover ./...
